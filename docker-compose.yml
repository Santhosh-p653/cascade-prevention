services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"
    environment:
      - HOSTNAME=0.0.0.0  # 👈 ADD THIS LINE
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
